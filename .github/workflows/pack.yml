name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 1' # Run every Monday at 01:30
  workflow_dispatch:
    inputs:
      language:
        description: 'Select the language to scan for green rules'
        required: true
        default: 'java'
        type: choice
        options:
        - java
        - cpp
        - javascript
        - python
        - action

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        # It use the language you choose in the button
        languages: ${{ github.event.inputs.language || 'java' }} # change to specify your repo language
        # It look into the folder codeql-custom-queries-<language>
        packs: titouancharrier/codeql-custom-queries-${{ github.event.inputs.language || 'java' }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ github.event.inputs.language || 'java' }}"
